spring.application.name=Gym-Management-API

# Render define a porta dinamicamente
server.port=${PORT:8080}

# Carrega variaveis locais a partir do .env (nunca versionado)
spring.config.import=optional:file:.env[.properties]

# Datasource: credenciais vem exclusivamente de variaveis de ambiente
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool pequeno para dividir o plano gratuito do Aiven sem estourar os slots
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=20000

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

admin.email=${ADMIN_EMAIL:admin@sistema.com}
admin.password=${ADMIN_PASSWORD:}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080,https://*.pages.dev}
